# This configuration file is used to run the basic suite of modelE
# regression tests. It is a required argument to mainDriver.py
[SYSCONFIG]
# Repository we are testing
#repository=simplex.giss.nasa.gov:/giss/gitrepo/modelE.git
repository=/discover/nobackup/modele/clones/master
#repository=/discover/nobackup/ccruz/devel/modelE.clones/debug
# What branch
repobranch=master
# Use a batch system (configured for SLURM on DISCOVER).
# If set to 'no', script (and commands therein) will run interactively.
usebatch=yes
# If we are using "modules" to load compilers then set to "yes"
# NOTE: If modules=yes then specify/use modulelist in COMPCONFIG section
# If set to 'no', scripts will use compilers available in the system.
modules=yes
# Filesystem where we are doing all the work
scratchdir=/discover/nobackup/ccruz
# Clean the regression testing scartch space (under scratchdir)
cleanscratch=yes
# Where we keep modelE baseline restarts. Used for verification.
basedir=/discover/nobackup/ccruz/modelE_baseline
# Run diffreport.x on modelE outpput 
diffreport=yes
# sort diffreport
sortdiff=yes
# Where to mail diff report
mailto=giss-modele-regression@lists.nasa.gov
# Update the baseline restarts (if different)
updatebase=yes
# If debugscript=yes then all unix commands go to stdout
debugscript=no
# compileflags options: default, debug, traps
compflags=traps
systemtests=yes
unittests=no
mock=no

# This section specifies the computational environment including,
# if specified, the module lists
[COMPCONFIG]
# What compilers we use choices: intel, gfortran, nag)
compilers=intel,gfortran
# Specify version for each compiler
compiler_versions=14.0.3.174,4.9.1
# Specify names of module lists here. Note that thes names must
# correspond to the ones referenced in regTools.py
modulelist=intel_intelmpi,gcc_openmpi
intel_intelmpi=comp/intel-14.0.3.174,mpi/impi-4.1.3.048
gcc_openmpi=other/comp/gcc-4.9.1,other/mpi/openmpi/1.8.1-gcc-4.9.1
nag_serial=comp/nag-5.3

# modelErc settings
[LIBSCONFIG]
# Where is the modelE data (ICs.BCs)
modeldatadir=/discover/nobackup/projects/giss/prod_input_files
# The following list names must correspond to the ones referenced
# in regTools.py.
# gcc modules
gccnetcdf=/usr/local/other/netcdf/3.6.2_gcc-4.9.1
gccpnetcdf=/usr/local/other/pnetcdf/1.2.0_gcc-4.9.1_openmpi-1.8.1
gccesmf=
gccmpi=openmpi
gccmpidir=/usr/local/other/SLES11.1/openMpi/1.8.1/gcc-4.9.1
# The following list names must correspond to the ones referenced
# in regTools.py.
# intel settings
intelnetcdf=/usr/local/other/netcdf/3.6.2_intel-14.0.3.174
intelpnetcdf=/usr/local/other/pnetcdf/1.2.0_intel-14.0.3.174_impi-4.1.3.048
intelesmf=
intelmpi=intel
intelmpidir=

# Rundeck configurations
[E4F40]
compilers=intel,gfortran
modes=mpi,serial
npes=1,8

[E1oM20]
compilers=intel,gfortran
modes=mpi,serial
npes=1,4

[SGP4TESTS]
compilers=gfortran,intel
modes=serial
npes=1

[nonProduction_E_AR5_C12]
compilers=intel,gfortran
modes=serial,mpi
npes=1,4

[nonProduction_E4TcadC12]
compilers=intel,gfortran
modes=serial,mpi
npes=1,4

